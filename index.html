<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheckerX Mini App</title>
    <!-- Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Socket.io Client Library -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #1e1e1e;
            color: #ffffff;
            margin: 0;
            padding: 10px;
        }
        #status {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #0088cc;
        }
        #board {
            width: 320px;
            height: 320px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 4px solid #333;
        }
        .cell {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .white { background-color: #eee; }
        .black { background-color: #444; }
        .cell.selected { background-color: #ffeb3b !important; }
        
        .piece {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            box-sizing: border-box;
        }
        .red { background-color: #e74c3c; border: 2px solid #b22222; }
        .white-piece { background-color: #ffffff; border: 2px solid #ccc; }
        .king::after { content: '👑'; font-size: 14px; display: block; text-align: center; }

        #game-over-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
    </style>
</head>
<body>

    <h2>CheckerX</h2>
    <div id="status">Connecting to server...</div>
    <div id="board"></div>

    <div id="game-over-modal">
        <h1 id="winner-text">Game Over</h1>
        <button onclick="initBoard()">Play Again</button>
    </div>

    <script>
        // Telegram WebApp Safety Check
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        const SOCKET_URL = "https://checkerx-backend.onrender.com";
        const socket = io(SOCKET_URL);

        const boardElement = document.getElementById('board');
        const statusElement = document.getElementById('status');
        const modalElement = document.getElementById('game-over-modal');

        let boardState = Array(8).fill(null).map(() => Array(8).fill(null));
        let selectedPiece = null;
        let currentPlayer = 'red';
        let isChainCapturing = false;
        
        let myColor = null; 
        let currentRoomId = null;

        socket.on("connect", () => {
            statusElement.innerText = "Finding an opponent...";
        });

        socket.on("waiting", (msg) => {
            statusElement.innerText = msg;
        });

        socket.on("gameStart", (data) => {
            myColor = data.color;
            currentRoomId = data.roomId;
            initBoard();
            updateTurnStatus();
        });

        socket.on("moveMade", (data) => {
            boardState = data.boardState;
            currentPlayer = data.currentPlayer;
            isChainCapturing = data.isChainCapturing;
            updateTurnStatus();
            renderBoard();
        });

        function updateTurnStatus() {
            if (myColor) {
                const isMyTurn = currentPlayer === myColor;
                statusElement.innerText = `You are ${myColor.toUpperCase()} | ${isMyTurn ? "YOUR TURN!" : "Opponent's Turn..."}`;
            }
        }

        function initBoard() {
            modalElement.style.display = 'none';
            boardState = Array(8).fill(null).map(() => Array(8).fill(null));
            currentPlayer = 'red';
            isChainCapturing = false;
            selectedPiece = null;

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const isBlack = (row + col) % 2 === 1;
                    if (isBlack) {
                        if (row < 3) boardState[row][col] = { type: 'red', isKing: false };
                        else if (row > 4) boardState[row][col] = { type: 'white', isKing: false };
                        else boardState[row][col] = null;
                    } else {
                        boardState[row][col] = null;
                    }
                }
            }
            renderBoard();
        }

        function renderBoard() {
            boardElement.innerHTML = '';
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const cell = document.createElement('div');
                    const isBlack = (row + col) % 2 === 1;
                    cell.className = `cell ${isBlack ? 'black' : 'white'}`;

                    if (selectedPiece && selectedPiece.row === row && selectedPiece.col === col) {
                        cell.classList.add('selected');
                    }

                    const pieceData = boardState[row][col];
                    if (pieceData) {
                        const piece = document.createElement('div');
                        piece.className = `piece ${pieceData.type === 'red' ? 'red' : 'white-piece'} ${pieceData.isKing ? 'king' : ''}`;
                        cell.appendChild(piece);
                    }

                    cell.addEventListener('click', () => handleCellClick(row, col));
                    boardElement.appendChild(cell);
                }
            }
        }

        function handleCellClick(row, col) {
            if (myColor && currentPlayer !== myColor) return;

            const clicked = boardState[row][col];

            if (isChainCapturing) {
                if (selectedPiece && selectedPiece.row === row && selectedPiece.col === col) return;
            } else if (clicked && clicked.type === currentPlayer) {
                selectedPiece = { row, col };
                renderBoard();
                return;
            }

            if (!selectedPiece || (row + col) % 2 !== 1 || clicked !== null) return;

            const mustCapture = playerHasCaptures(currentPlayer);
            const validCaptures = getValidCapturesForPiece(selectedPiece.row, selectedPiece.col);

            if (mustCapture) {
                const moveCap = validCaptures.find(c => c.landR === row && c.landC === col);
                if (moveCap) {
                    executeCapture(selectedPiece.row, selectedPiece.col, moveCap);
                }
                return;
            }

            const p = boardState[selectedPiece.row][selectedPiece.col];
            if (p.isKing) {
                if (isClearDiagonal(selectedPiece.row, selectedPiece.col, row, col)) {
                    executeMove(selectedPiece.row, selectedPiece.col, row, col);
                }
            } else {
                const rowDiff = row - selectedPiece.row;
                const colDiff = Math.abs(col - selectedPiece.col);
                const isValidDir = (currentPlayer === 'red' && rowDiff === 1) || (currentPlayer === 'white' && rowDiff === -1);
                if (isValidDir && Math.abs(rowDiff) === 1 && colDiff === 1) {
                    executeMove(selectedPiece.row, selectedPiece.col, row, col);
                }
            }
        }

        function playerHasCaptures(player) {
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (boardState[r][c] && boardState[r][c].type === player) {
                        if (getValidCapturesForPiece(r, c).length > 0) return true;
                    }
                }
            }
            return false;
        }

        function getValidCapturesForPiece(r, c) {
            const piece = boardState[r][c];
            if (!piece) return [];
            const captures = [];
            const directions = [[1, 1], [1, -1], [-1, 1], [-1, -1]];

            if (piece.isKing) {
                for (let [dr, dc] of directions) {
                    let step = 1;
                    while (r + dr * step >= 0 && r + dr * step < 8 && c + dc * step >= 0 && c + dc * step < 8) {
                        const midR = r + dr * step;
                        const midC = c + dc * step;
                        const targetPiece = boardState[midR][midC];

                        if (targetPiece) {
                            if (targetPiece.type === piece.type) break;
                            const landR = midR + dr;
                            const landC = midC + dc;
                            if (landR >= 0 && landR < 8 && landC >= 0 && landC < 8 && boardState[landR][landC] === null) {
                                captures.push({ landR, landC, capR: midR, capC: midC });
                            }
                            break; 
                        }
                        step++;
                    }
                }
            } else {
                for (let [dr, dc] of directions) {
                    const midR = r + dr;
                    const midC = c + dc;
                    const landR = r + dr * 2;
                    const landC = c + dc * 2;

                    if (landR >= 0 && landR < 8 && landC >= 0 && landC < 8) {
                        const midPiece = boardState[midR][midC];
                        if (midPiece && midPiece.type !== piece.type && boardState[landR][landC] === null) {
                            captures.push({ landR, landC, capR: midR, capC: midC });
                        }
                    }
                }
            }
            return captures;
        }

        function executeCapture(fromR, fromC, capData) {
            const p = boardState[fromR][fromC];
            boardState[capData.capR][capData.capC] = null;
            boardState[capData.landR][capData.landC] = p;
            boardState[fromR][fromC] = null;

            if ((currentPlayer === 'red' && capData.landR === 7) || (currentPlayer === 'white' && capData.landR === 0)) {
                p.isKing = true;
            }

            const nextCaptures = getValidCapturesForPiece(capData.landR, capData.landC);
            if (nextCaptures.length > 0) {
                isChainCapturing = true;
                selectedPiece = { row: capData.landR, col: capData.landC };
                renderBoard();
            } else {
                isChainCapturing = false;
                finishTurn();
            }
        }

        function isClearDiagonal(fromR, fromC, toR, toC) {
            if (Math.abs(toR - fromR) !== Math.abs(toC - fromC)) return false;
            const stepR = Math.sign(toR - fromR);
            const stepC = Math.sign(toC - fromC);
            let r = fromR + stepR;
            let c = fromC + stepC;
            while (r !== toR && c !== toC) {
                if (boardState[r][c] !== null) return false;
                r += stepR;
                c += stepC;
            }
            return true;
        }

        function executeMove(fromR, fromC, toR, toC) {
            const p = boardState[fromR][fromC];
            if ((currentPlayer === 'red' && toR === 7) || (currentPlayer === 'white' && toR === 0)) {
                p.isKing = true;
            }
            boardState[toR][toC] = p;
            boardState[fromR][fromC] = null;
            finishTurn();
        }

        function finishTurn() {
            selectedPiece = null;
            currentPlayer = currentPlayer === 'red' ? 'white' : 'red';

            updateTurnStatus();
            renderBoard();

            socket.emit('makeMove', {
                roomId: currentRoomId,
                boardState: boardState,
                currentPlayer: currentPlayer,
                isChainCapturing: isChainCapturing
            });
        }
    </script>
</body>
</html>
